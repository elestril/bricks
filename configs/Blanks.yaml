generate:
  Tiles:
    generate:
      x: [1,2,3,4,5,6,7,8]
      y: [1,2,3,4,5,6,7,8]
    condition: '{x} >= {y}'
    config: &Reference
      grid: true
      type: Tile
      set: Blank
      studs: False
  Walls:
    generate:
      x: [1,2,3,4,5,6,7,8]
    config: 
      <<: *Reference
      type: Wall
      path: Reference/Walls
      studs: True
      y: 1
      z: 4
  HexGrids: 
    generate: 
       x: [1,2,3,4]
       y: [1,2,3,4]
    config: 
      <<: *Reference
      family: Hex
      grid: True
  HexHalfX:
    generate: 
       x: [1]
       y: [1,2,3,4]
    config: 
      <<: *Reference
      family: Hex
      variant: HalfX
      cutX: 0
  HexHalfY:
    generate: 
       x: [1,2,3,4]
       y: [1]
    config: 
      <<: *Reference
      family: Hex
      variant: HalfY
      cutY: 0

  HexRSTiles: 
    generate:
      x: [1,2,3,4]
      family: ["HexR", "HexS"]
    config:
      <<: *Reference
      grid: True
